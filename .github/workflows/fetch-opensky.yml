name: OpenSky Ege Veri Toplama (Data Dalı)

on:
  schedule:
    # Küçük alan kotasını (24 kare derece = 1 kredi/istek) korumak için 30 dakikada bir çalıştırılır
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manuel tetikleme nedeni (isteğe bağlı)'
        required: false
        default: 'Manuel veri güncelleme'

permissions:
  contents: write

jobs:
  fetch-and-publish-data:
    name: OpenSky Verisini Çek ve data Dalına Yaz
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Uygulama kodunu main dalından al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Varsa mevcut data dalındaki son başarılı verileri geri yükle
        run: |
          git fetch origin data:refs/remotes/origin/data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            echo "Mevcut data dalı bulundu; geçmiş latest.json ve snapshots.json yükleniyor..."
            git checkout refs/remotes/origin/data -- data/latest.json data/snapshots.json public/data/latest.json public/data/snapshots.json 2>/dev/null || true
          else
            echo "Henüz uzak depoda data dalı yok; ilk kez oluşturulacak."
          fi

      - name: OpenSky Ege verisini çek ve normalleştir
        id: fetch_data
        continue-on-error: true
        env:
          # İsteğe bağlı OAuth2 istemci kimlik bilgileri: Tanımlıysa Bearer token alınır, yoksa anonim erişim kullanılır
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: npm run data:fetch

      - name: Güncel veriyi main yerine ayrı data dalına kaydet
        if: always()
        run: |
          WORK_DIR=$(mktemp -d)
          NEW_DIR="$WORK_DIR/new"
          OLD_DIR="$WORK_DIR/old"
          mkdir -p "$NEW_DIR/data" "$NEW_DIR/public/data" "$OLD_DIR"

          cp data/latest.json "$NEW_DIR/data/latest.json"
          cp data/snapshots.json "$NEW_DIR/data/snapshots.json"
          cp public/data/latest.json "$NEW_DIR/public/data/latest.json"
          cp public/data/snapshots.json "$NEW_DIR/public/data/snapshots.json"

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git show refs/remotes/origin/data:data/latest.json > "$OLD_DIR/latest.json" 2>/dev/null || true
            git show refs/remotes/origin/data:data/snapshots.json > "$OLD_DIR/snapshots.json" 2>/dev/null || true

            # Çalışma ağacındaki dosyalar yerine doğrudan refs/remotes/origin/data referansından çıkarılan eski dosyalarla karşılaştır
            SHOULD_UPDATE=$(node scripts/compare-data.mjs "$OLD_DIR" "$NEW_DIR")
          else
            SHOULD_UPDATE="true"
          fi

          if [ "$SHOULD_UPDATE" = "false" ]; then
            echo "Son başarılı veri, snapshot geçmişi ve hata türü değişmedi (yalnızca deneme zaman damgası/mesajı güncellendi); gereksiz commit atlanıyor."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if git show-ref --verify --quiet refs/remotes/origin/data; then
              git checkout -f -B data refs/remotes/origin/data
            else
              git checkout --orphan data
              git rm -rf . || true
            fi

            mkdir -p data public/data
            cp "$NEW_DIR/data/latest.json" data/latest.json
            cp "$NEW_DIR/data/snapshots.json" data/snapshots.json
            cp "$NEW_DIR/public/data/latest.json" public/data/latest.json
            cp "$NEW_DIR/public/data/snapshots.json" public/data/snapshots.json

            git add data/latest.json data/snapshots.json public/data/latest.json public/data/snapshots.json
            if git diff --cached --quiet; then
              echo "Veride değişiklik yok, commit atlanıyor."
            else
              git commit -m "chore(data): OpenSky Ege hava sahası anlık veri güncellemesi [skip ci]"
              git push origin data
            fi
          fi

      - name: Veri çekim hatası varsa iş (job) sonucunu başarısız işaretle
        if: always() && steps.fetch_data.outcome != 'success'
        run: |
          echo "::error::OpenSky API veri çekimi başarısız oldu. Son başarılı veriler korundu ve data dalı durumu güncellendi; ancak çekim hatası nedeniyle iş başarısız olarak işaretleniyor."
          exit 1
