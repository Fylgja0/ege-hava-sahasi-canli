name: OpenSky Ege Veri Toplama (Data Dalı)

on:
  schedule:
    # Küçük alan kotasını (24 kare derece = 1 kredi/istek) korumak için 30 dakikada bir çalıştırılır
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manuel tetikleme nedeni (isteğe bağlı)'
        required: false
        default: 'Manuel veri güncelleme'

permissions:
  contents: write

jobs:
  fetch-and-publish-data:
    name: OpenSky Verisini Çek ve data Dalına Yaz
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Uygulama kodunu main dalından al
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Varsa mevcut data dalındaki son başarılı verileri geri yükle
        run: |
          git fetch origin data:refs/remotes/origin/data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            echo "Mevcut data dalı bulundu; geçmiş latest.json ve snapshots.json yükleniyor..."
            git checkout refs/remotes/origin/data -- data/latest.json data/snapshots.json public/data/latest.json public/data/snapshots.json 2>/dev/null || true
          else
            echo "Henüz uzak depoda data dalı yok; ilk kez oluşturulacak."
          fi

      - name: OpenSky Ege verisini çek ve normalleştir
        id: fetch_data
        continue-on-error: true
        env:
          # İsteğe bağlı OAuth2 istemci kimlik bilgileri: Tanımlıysa Bearer token alınır, yoksa anonim erişim kullanılır
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: npm run data:fetch

      - name: Güncel veriyi main yerine ayrı data dalına kaydet
        if: always()
        run: |
          WORK_DIR=$(mktemp -d)
          cp -r data "$WORK_DIR/data"
          cp -r public "$WORK_DIR/public"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data refs/remotes/origin/data
          else
            git checkout --orphan data
            git rm -rf . || true
          fi

          # Tekrarlayan hata durumlarında yalnızca lastAttempt.timestamp değiştiyse her 30 dakikada bir gereksiz commit üretme
          SHOULD_UPDATE=$(node -e '
            const fs = require("node:fs");
            const readJson = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; } };
            const stripTransient = (obj) => {
              if (!obj || typeof obj !== "object") return null;
              const copy = JSON.parse(JSON.stringify(obj));
              if (copy.lastAttempt) {
                delete copy.lastAttempt.timestamp;
                delete copy.lastAttempt.message;
              }
              return JSON.stringify(copy);
            };
            const oldLatest = stripTransient(readJson("data/latest.json"));
            const newLatest = stripTransient(readJson(process.argv[1] + "/data/latest.json"));
            const oldSnaps = stripTransient(readJson("data/snapshots.json"));
            const newSnaps = stripTransient(readJson(process.argv[1] + "/data/snapshots.json"));
            if (!oldLatest || !oldSnaps || oldLatest !== newLatest || oldSnaps !== newSnaps) {
              process.stdout.write("true");
            } else {
              process.stdout.write("false");
            }
          ' "$WORK_DIR")

          if [ "$SHOULD_UPDATE" = "false" ]; then
            echo "Son başarılı veri, snapshot geçmişi ve hata türü değişmedi (yalnızca deneme zaman damgası güncellendi); gereksiz commit atlanıyor."
          else
            mkdir -p data public/data
            cp "$WORK_DIR/data/latest.json" data/latest.json
            cp "$WORK_DIR/data/snapshots.json" data/snapshots.json
            cp "$WORK_DIR/public/data/latest.json" public/data/latest.json
            cp "$WORK_DIR/public/data/snapshots.json" public/data/snapshots.json

            git add data/latest.json data/snapshots.json public/data/latest.json public/data/snapshots.json
            if git diff --cached --quiet; then
              echo "Veride değişiklik yok, commit atlanıyor."
            else
              git commit -m "chore(data): OpenSky Ege hava sahası anlık veri güncellemesi [skip ci]"
              git push origin data
            fi
          fi

      - name: Veri çekim hatası varsa iş (job) sonucunu başarısız işaretle
        if: always() && steps.fetch_data.outcome != 'success'
        run: |
          echo "::error::OpenSky API veri çekimi başarısız oldu. Son başarılı veriler korundu ve data dalı durumu güncellendi; ancak çekim hatası nedeniyle iş başarısız olarak işaretleniyor."
          exit 1
